    - Border radius: 16px → 10px (0.625rem) — exact --radius token
    - Border color: rgba(255,255,255,0.08) → oklch(0.269 0 0) — exact dark-mode --border token
    - Logo icon gradient: updated to use sidebar-primary oklch(0.488 0.243 264.376)

    - Text colors: foreground oklch(0.985 0 0), muted oklch(0.708 0 0)
    - Roboto loaded via Google Fonts (requires network; falls back to system sans-serif)

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <title>TaskFlow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 420px;
      height: 280px;
      overflow: hidden;
      background: oklch(0.145 0 0);
      font-family: 'Roboto', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      height: 100%;
      background: oklch(0.145 0 0);
      border-radius: 10px;
      border: 1px solid oklch(0.269 0 0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, oklch(0.488 0.243 264.376) 0%, oklch(0.45 0.22 300) 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(96,165,250,0.35);
    }

    .logo-icon svg {
      width: 26px;
      height: 26px;
    }

    .logo-text {
      font-size: 26px;
      font-weight: 700;
      color: oklch(0.985 0 0);
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 13px;
      color: oklch(0.708 0 0);
      letter-spacing: 0.3px;
    }

    .spinner-track {
      width: 160px;
      height: 3px;
      background: oklch(0.269 0 0);
      border-radius: 2px;
      overflow: hidden;
    }

    .spinner-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #60A5FA, #93C5FD, transparent);
      border-radius: 2px;
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <!-- Checkmark icon matching app's task-complete iconography -->
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <div class="logo-text">TaskFlow</div>
    </div>
    <div class="tagline">Starting up…</div>
    <div class="spinner-track">
      <div class="spinner-bar"></div>
    </div>
  </div>
</body>
</html>
